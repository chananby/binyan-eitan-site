<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שמשונית — בניין איתן</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ccc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Heebo', 'Arial Hebrew', Arial, sans-serif;
    }

    /* ─── Banner canvas — 60×100 cm → 600×1000 px ───────── */
    .banner {
      width: 600px;
      height: 1000px;
      background-color: #F0EDE6; /* bone warm */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      position: relative;
    }

    /* ─── Top band: "כאן בונים בכיף" ─────────────────────── */
    .top-band {
      background-color: #2D2926;
      padding: 28px 32px 24px;
      text-align: center;
      flex-shrink: 0;
    }
    .top-band h1 {
      color: #F0EDE6;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .top-band .accent-line {
      width: 60px;
      height: 3px;
      background: #8D775F;
      margin: 12px auto 0;
      border-radius: 2px;
    }

    /* ─── Logo + company name ─────────────────────────────── */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 32px 20px;
      flex-shrink: 0;
      gap: 14px;
    }
    .brand-section img {
      width: 160px;
      height: auto;
      object-fit: contain;
    }
    .company-name {
      font-size: 48px;
      font-weight: 900;
      color: #2D2926;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    /* ─── Slogan ──────────────────────────────────────────── */
    .slogan-section {
      text-align: center;
      padding: 0 40px 28px;
      flex-shrink: 0;
    }
    .slogan-section p {
      font-size: 21px;
      font-weight: 400;
      color: #5a4e45;
      letter-spacing: 0.01em;
      line-height: 1.55;
    }

    /* ─── Bronze divider ──────────────────────────────────── */
    .divider {
      width: calc(100% - 64px);
      height: 2px;
      background: linear-gradient(90deg, transparent, #8D775F 20%, #8D775F 80%, transparent);
      margin: 0 32px;
      flex-shrink: 0;
    }

    /* ─── Contact section ─────────────────────────────────── */
    .contact-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 40px 20px;
      gap: 0;
    }

    /* Phone rows */
    .phone-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .phone-row .icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .phone-number {
      font-size: 30px;
      font-weight: 700;
      color: #2D2926;
      letter-spacing: 0.05em;
      direction: ltr;
    }
    .phone-label {
      font-size: 12px;
      font-weight: 300;
      color: #8D775F;
      letter-spacing: 0.12em;
      text-align: center;
      margin-bottom: 4px;
    }

    /* QR code */
    .qr-wrapper {
      margin: 16px 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .qr-wrapper img {
      width: 120px;
      height: 120px;
      display: block;
      border: 3px solid #2D2926;
      padding: 6px;
      background: #fff;
    }
    .qr-caption {
      font-size: 11px;
      color: #8D775F;
      font-weight: 400;
      letter-spacing: 0.1em;
    }

    /* Web + email */
    .web-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }
    .web-row .web-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .web-row span {
      font-size: 17px;
      font-weight: 400;
      color: #3a302a;
      direction: ltr;
      letter-spacing: 0.02em;
    }

    /* ─── Bottom band ─────────────────────────────────────── */
    .bottom-band {
      background-color: #2D2926;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="banner">

  <!-- TOP BAND -->
  <div class="top-band">
    <h1>כאן בונים בכיף</h1>
    <div class="accent-line"></div>
  </div>

  <!-- LOGO + NAME -->
  <div class="brand-section">
    <img src="/logo.png" alt="לוגו בניין איתן" />
    <div class="company-name">בניין איתן</div>
  </div>

  <!-- SLOGAN -->
  <div class="slogan-section">
    <p>בונים עתיד יציב.</p>
    <p>אתכם ובשבילכם.</p>
  </div>

  <!-- DIVIDER -->
  <div class="divider"></div>

  <!-- CONTACTS -->
  <div class="contact-section">

    <!-- WhatsApp -->
    <div class="phone-label">וואטסאפ / טלפון</div>
    <div class="phone-row">
      <!-- WhatsApp SVG icon -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.978-1.402A9.953 9.953 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z" fill="#25D366"/>
        <path d="M16.75 14.49c-.27-.135-1.6-.79-1.847-.879-.247-.09-.427-.135-.607.135-.18.27-.697.879-.854 1.059-.157.18-.314.202-.584.067-.27-.135-1.14-.42-2.172-1.34-.803-.716-1.345-1.6-1.503-1.87-.157-.27-.017-.416.118-.55.12-.12.27-.315.405-.472.134-.157.18-.27.27-.45.089-.18.044-.337-.022-.472-.067-.135-.607-1.462-.832-2.002-.219-.526-.441-.454-.607-.463l-.517-.009c-.18 0-.472.067-.72.337-.246.27-.942.92-.942 2.244s.965 2.602 1.1 2.782c.134.18 1.9 2.9 4.603 4.066.643.278 1.145.444 1.535.568.645.205 1.232.176 1.696.107.517-.077 1.6-.654 1.826-1.285.225-.63.225-1.17.157-1.285-.067-.112-.247-.18-.517-.315z" fill="#fff"/>
      </svg>
      <span class="phone-number">058-500-8447</span>
    </div>

    <!-- Office phone -->
    <div class="phone-label" style="margin-top:4px;">טלפון משרד</div>
    <div class="phone-row">
      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.18 21 3 13.82 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.01l-2.21 2.21z" fill="#8D775F"/>
      </svg>
      <span class="phone-number">02-5000-447</span>
    </div>

    <!-- QR -->
    <div class="qr-wrapper">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://wa.me/972585008447&color=2D2926&bgcolor=ffffff&margin=4"
        alt="QR וואטסאפ"
      />
      <span class="qr-caption">סרוק לוואטסאפ</span>
    </div>

    <!-- Website -->
    <div class="web-row">
      <svg class="web-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#2D2926" stroke-width="1.5"/>
        <path d="M12 3c-2 2.5-3 5-3 9s1 6.5 3 9M12 3c2 2.5 3 5 3 9s-1 6.5-3 9M3 12h18" stroke="#2D2926" stroke-width="1.5"/>
      </svg>
      <span>www.binyaneitan.com</span>
    </div>

    <!-- Email -->
    <div class="web-row" style="margin-top:6px;">
      <svg class="web-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke="#2D2926" stroke-width="1.5"/>
        <path d="M3 7l9 6 9-6" stroke="#2D2926" stroke-width="1.5"/>
      </svg>
      <span>office@binyaneitan.com</span>
    </div>

  </div><!-- /contacts -->

  <!-- BOTTOM BAND -->
  <div class="bottom-band"></div>

</div><!-- /banner -->
</body>
</html>
