            if (idx === -1) {
                return (
                    <div className="max-w-md w-full text-center p-10 bg-slate-900 text-white rounded-3xl shadow-2xl border-4 border-yellow-500 animate-in zoom-in">
                        <div className="text-7xl mb-6">👑</div>
                        <h2 className="text-3xl font-black mb-4 text-yellow-400">המשימה הושלמה!</h2>
                        <p className="text-lg mb-8 text-slate-300">צלחתם את הדילמות הקשות ביותר והוכחתם מנהיגות תורנית ובקיאות עמוקה בדרכם של מרדכי ואסתר.</p>
                        <div className="flex flex-col gap-3">
                            <button onClick={share} className="bg-green-600 hover:bg-green-500 text-white py-4 rounded-xl font-black text-lg transition-all">שתפו לחברים 📱</button>
                            <button onClick={onBack} className="bg-yellow-500 text-slate-900 py-4 rounded-xl font-black text-lg hover:bg-yellow-400">חזרה לממלכה</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full max-w-2xl bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700 animate-in fade-in slide-in-from-bottom-4">
                    <div className="bg-slate-900 p-4 flex justify-between items-center text-yellow-400 border-b border-slate-700">
                        <span className="font-black tracking-widest uppercase text-sm">דילמת המנהיג - שלב {idx + 1} / {DILEMMAS.length}</span>
                        <button onClick={onBack} className="text-slate-400 hover:text-white text-sm">יציאה</button>
                    </div>
                    <div className="p-6 md:p-10">
                        <div className="bg-slate-900/50 p-6 rounded-2xl mb-8 border border-white/5">
                            <h4 className="text-purple-400 font-black text-lg mb-2">{DILEMMAS[idx].title}</h4>
                            <p className="text-slate-300 text-lg leading-relaxed">{DILEMMAS[idx].task}</p>
                        </div>
                        <h3 className="text-2xl font-black text-white mb-8 text-center leading-snug">{DILEMMAS[idx].q}</h3>
                        <div className="grid gap-3">
                            {DILEMMAS[idx].opts.map((o, i) => {
                                let style = "border-slate-600 bg-slate-700/50 hover:bg-slate-600 text-slate-200";
                                if (feedback) {
                                    if (i === DILEMMAS[idx].ans) style = "bg-green-500/20 border-green-500 text-green-400 ring-2 ring-green-500/30";
                                    else if (selected === i) style = "bg-red-500/20 border-red-500 text-red-400 opacity-60";
                                    else style = "opacity-30 border-transparent grayscale";
                                }
                                return (
                                    <button key={i} onClick={() => handleChoice(i)} disabled={feedback}
                                        className={`w-full p-4 text-right border-2 rounded-xl font-bold transition-all text-lg ${style} ${!feedback && 'active:scale-95'}`}>
                                        {o}
                                    </button>
                                );
                            })}
                        </div>
                        {feedback && (
                            <div className="mt-8 animate-in zoom-in duration-300">
                                <div className={`p-6 rounded-2xl mb-6 text-base leading-relaxed border ${feedback === 'yes' ? 'bg-green-500/10 border-green-500/30 text-green-100' : 'bg-red-500/10 border-red-500/30 text-red-100'}`}>
                                    <strong className="block text-xl mb-2">{feedback === 'yes' ? 'הכרעה תורנית מדויקת!' : 'נסו שוב...'}</strong>
                                    {feedback === 'yes' ? DILEMMAS[idx].rationale : "השיקול שבחרתם הגיוני פוליטית אולי, אך אינו תואם את הכרעתם הרוחנית של מנהיגי ישראל בסיטואציה זו."}
                                </div>
                                {feedback === 'yes' ? (
                                    <button onClick={next} className="w-full bg-white hover:bg-slate-200 text-slate-900 py-5 rounded-xl font-black text-xl transition-all shadow-lg active:scale-95">
                                        {idx + 1 === DILEMMAS.length ? 'לסיום המשימה!' : 'לדילמה הבאה'}
                                    </button>
                                ) : (
                                    <button onClick={() => { setFeedback(null); setSelected(null); }} className="w-full bg-slate-600 hover:bg-slate-500 text-white py-4 rounded-xl font-bold text-lg transition-all">
                                        בחירה מחודשת 🔄
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [view, setView] = useState('home'); // home, quiz1, quiz2, dilemma
            const [muted, setMuted] = useState(false);

            // Handle back button and direct links (History API)
            useEffect(() => {
                const handlePopState = () => {
                    const params = new URLSearchParams(window.location.search);
                    const act = params.get('act');
                    if (act === '1') setView('quiz1');
                    else if (act === '2') setView('quiz2');
                    else if (act === '3') setView('dilemma');
                    else setView('home');
                };

                // Trigger on load
                handlePopState();

                // Listen to back/forward browser buttons
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            // Custom navigate function for clean URL updates
            const navigate = (viewName, actParam) => {
                setView(viewName);
                if (actParam) {
                    window.history.pushState({ view: viewName }, '', `?act=${actParam}`);
                } else {
                    window.history.pushState({ view: 'home' }, '', window.location.pathname);
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
                    {/* Audio Toggle */}
                    <button 
                        onClick={() => setMuted(!muted)} 
                        className="fixed top-4 left-4 z-50 w-12 h-12 flex items-center justify-center bg-white shadow-lg rounded-full text-xl hover:scale-110 transition-transform"
                        title={muted ? "הפעל צליל" : "השתק צליל"}
                    >
                        {muted ? '🔇' : '🔊'}
                    </button>

                    {view === 'home' && (
                        <div className="max-w-md w-full text-center space-y-8 animate-in fade-in zoom-in duration-500">
                            <BinyanLogo />

                            <div className="grid grid-cols-1 gap-5">
                                <button onClick={() => navigate('quiz1', '1')} 
                                    className="card-pop bg-white p-6 rounded-3xl shadow-xl border-b-8 border-purple-300 flex items-center gap-5 text-right group">
                                    <div className="w-16 h-16 shrink-0 bg-purple-100 rounded-2xl flex items-center justify-center text-4xl group-hover:scale-110 transition-all">📖</div>
                                    <div>
                                        <h3 className="text-2xl font-black text-purple-900 leading-none mb-1">עומק המגילה</h3>
                                        <p className="text-slate-500 font-bold leading-tight">חידון בסיס: דמויות, מדרשים ופרשנות חז"ל</p>
                                    </div>
                                </button>

                                <button onClick={() => navigate('quiz2', '2')} 
                                    className="card-pop bg-white p-6 rounded-3xl shadow-xl border-b-8 border-indigo-300 flex items-center gap-5 text-right group">
                                    <div className="w-16 h-16 shrink-0 bg-indigo-100 rounded-2xl flex items-center justify-center text-4xl group-hover:scale-110 transition-all">📜</div>
                                    <div>
                                        <h3 className="text-2xl font-black text-indigo-900 leading-none mb-1">סוגיות בהלכה</h3>
                                        <p className="text-slate-500 font-bold leading-tight">חידון למתקדמים: חיובים, מנהגים ודינים מורכבים</p>
                                    </div>
                                </button>

                                <button onClick={() => navigate('dilemma', '3')} 
                                    className="card-pop bg-slate-900 p-6 rounded-3xl shadow-xl border-b-8 border-yellow-500 flex items-center gap-5 text-right group">
                                    <div className="w-16 h-16 shrink-0 bg-yellow-500 rounded-2xl flex items-center justify-center text-4xl group-hover:scale-110 transition-all">⚖️</div>
                                    <div>
                                        <h3 className="text-2xl font-black text-yellow-400 leading-none mb-1">דילמת המנהיג</h3>
                                        <p className="text-slate-400 font-bold leading-tight">סימולציה תורנית: קבלת החלטות בזמן משבר</p>
                                    </div>
                                </button>
                            </div>

                            <div className="text-slate-500 font-bold text-sm bg-slate-200 py-2 px-4 rounded-full inline-block">
                                🇮🇱 פורים חזק ובטוח לכל עם ישראל 🇮🇱
                            </div>
                        </div>
                    )}

                    {view === 'quiz1' && <QuizComponent type="1" title="עומק המגילה" data={QUIZ_A} isMuted={muted} onBack={() => navigate('home', null)} />}
                    {view === 'quiz2' && <QuizComponent type="2" title="סוגיות בהלכה" data={QUIZ_B} isMuted={muted} onBack={() => navigate('home', null)} />}
                    {view === 'dilemma' && <DilemmaComponent isMuted={muted} onBack={() => navigate('home', null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
