<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חידון פורים האינטראקטיבי | בניין איתן</title>
    
    <!-- Meta Tags for WhatsApp, Facebook, Telegram etc. -->
    <meta property="og:title" content="חידון פורים | בניין איתן">
    <meta property="og:description" content="ליהודים הייתה אורה ושמחה! בואו לבחון את הידע שלכם בחידון פורים חגיגי, תורני ומאתגר.">
    
    <!-- תמונה אמינה ומהירה של מגילת אסתר מויקימדיה - עובדת מצוין בוואטסאפ -->
    <meta property="og:image" itemprop="image" content="https://upload.wikimedia.org/wikipedia/commons/3/36/Megillah_1.JPG">
    <meta property="og:image:secure_url" itemprop="image" content="https://upload.wikimedia.org/wikipedia/commons/3/36/Megillah_1.JPG">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">
    <meta property="og:type" content="website">
    
    <!-- Twitter Cards (עוזר גם במערכות אחרות) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="חידון פורים | בניין איתן">
    <meta name="twitter:description" content="ליהודים הייתה אורה ושמחה! בואו לבחון את הידע שלכם בחידון פורים.">
    <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/3/36/Megillah_1.JPG">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Assistant:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'Assistant', 'Heebo', sans-serif; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #f3f4f6;
        }

        .purim-gradient { 
            background: linear-gradient(135deg, #6d28d9 0%, #a855f7 100%); 
        }

        /* Floating Animation */
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Progress Basket Animation */
        .basket-item {
            animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounce-in {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Pulse for Correct Answer */
        .correct-pulse {
            animation: pulse-green 1.5s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Shelter Mode Banner Animation */
        .banner-slide {
            animation: slide-down 0.8s ease-out;
        }
        @keyframes slide-down {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .logo-container {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sound Engine
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                }
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        };

        // Custom Combined Brand Logo Component
        const BrandLogo = ({ light = false }) => (
            <div className="flex flex-col items-center logo-container mb-4">
                <svg width="100" height="100" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" className="floating">
                    {/* Stylized Building/Foundation (Binyan) */}
                    <path d="M40 160V80L100 40L160 80V160H40Z" fill={light ? "white" : "#6d28d9"} fillOpacity="0.2" stroke={light ? "white" : "#6d28d9"} strokeWidth="4" />
                    <rect x="70" y="100" width="20" height="20" rx="2" fill={light ? "white" : "#6d28d9"} fillOpacity="0.4" />
                    <rect x="110" y="100" width="20" height="20" rx="2" fill={light ? "white" : "#6d28d9"} fillOpacity="0.4" />
                    <rect x="85" y="130" width="30" height="30" rx="2" fill={light ? "white" : "#6d28d9"} />
                    
                    {/* Purim Mask overlapping the building */}
                    <path d="M30 90C30 80 50 70 80 75C100 75 100 85 120 85C150 85 170 80 170 90C170 110 150 130 100 130C50 130 30 110 30 90Z" fill="#FACC15" stroke="white" strokeWidth="3" />
                    <circle cx="70" cy="100" r="8" fill="#4C1D95" />
                    <circle cx="130" cy="100" r="8" fill="#4C1D95" />
                    <path d="M85 115C95 120 105 120 115 115" stroke="#4C1D95" strokeWidth="2" strokeLinecap="round" />
                    
                    {/* Decorative Elements */}
                    <circle cx="160" cy="50" r="5" fill="#FACC15" />
                    <circle cx="40" cy="40" r="4" fill="#A855F7" />
                </svg>
                <div className={`mt-2 text-2xl font-black ${light ? "text-white" : "text-purple-900"}`} style={{letterSpacing: '-1px'}}>
                    בניין איתן
                </div>
            </div>
        );

        const questions = [
            {
                question: "מדוע נגזרה גזירת כליה על עם ישראל בימי אחשוורוש לפי חז\"ל?",
                options: ["מפני שהשתחוו לפסל ונהנו מסעודת אחשוורוש", "מפני ששכחו את תורת משה", "מפני שלא עלו לארץ ישראל", "מפני שמרדכי לא השתחווה"],
                answer: 0,
                rationale: "הגמרא במסכת מגילה מציינת ששילוב העבודה זרה מהעבר וההנאה מסעודת אחשוורוש גרמו לקטרוג."
            },
            {
                question: "מי מזוהה במדרש כ'ממוכן', ומה הייתה הצעתו?",
                options: ["דניאל הנביא", "המן - הציע להרוג את ושתי", "אליהו הנביא", "התך"],
                answer: 1,
                rationale: "חז\"ל מזהים את ממוכן כהמן, שקפץ בראש להציע הצעה שתשרת את האינטרסים שלו."
            },
            {
                question: "מדוע סירב מרדכי להשתחוות להמן?",
                options: ["בגלל האיבה בין יהודה לעמלק", "מכיוון שהמן חקק צלם עבודה זרה על בגדו", "מכיוון שהמן היה עבד של מרדכי", "כי המלך לא באמת ציווה"],
                answer: 1,
                rationale: "המן הפך את עצמו לאלוהות או נשא עליו סמל עבודה זרה, ולכן מרדכי מסר את הנפש."
            },
            {
                question: "מהו הסכום שהציע המן למלך תמורת השמדת היהודים?",
                options: ["חמשת אלפים כיכר זהב", "מאה אלף מנה כסף", "שבעת אלפים כיכר כסף", "עשרת אלפים כיכר כסף"],
                answer: 3,
                rationale: "זהו הסכום הנקוב במגילה, כנגד עשרת אלפי מחצית השקל של בני ישראל."
            },
            {
                question: "באיזה תאריך חלו שלושת ימי הצום שגזרה אסתר?",
                options: ["י\"א-י\"ג באדר", "י\"ג-ט\"ו בניסן", "א'-ג' בסיוון", "י'-י\"ב בתשרי"],
                answer: 1,
                rationale: "הצום היה בחודש ניסן, ומרדכי חשש שזה יבטל את שמחת הפסח, אך אסתר עמדה על כך."
            },
            {
                question: "מה היה הקשר המשפחתי המקורי בין מרדכי לאסתר?",
                options: ["דוד ואחיינית", "אחים", "בני דודים (בת דודו)", "סבא ונכדה"],
                answer: 2,
                rationale: "כתוב 'בת אביחיל דוד מרדכי', כלומר מרדכי ואביה היו אחים."
            },
            {
                question: "מי היו בגתן ותרש ומה היה תפקידם?",
                options: ["יועצי המלך", "שומרי הסף שניסו להתנקש במלך", "שרי הצבא", "טבחי הארמון"],
                answer: 1,
                rationale: "שני סריסים משומרי הסף שקצפו על המלך ורצו להתנקש בו."
            },
            {
                question: "מדוע נקרא החג 'פורים'?",
                options: ["מלשון פורענות", "על שם הפאר של אסתר", "על שם ה'פור' (הגורל)", "מלשון הפרה"],
                answer: 2,
                rationale: "על שם הגורל (פור) שהפיל המן לקביעת יום ההשמדה."
            },
            {
                question: "אילו ערים חוגגות את פורים בט\"ו באדר?",
                options: ["ערים גדולות", "ערי בירה", "ערים מוקפות חומה מימי יהושע בן נון", "רק ירושלים ושושן"],
                answer: 2,
                rationale: "תיקנו לפי זמן יהושע כדי לחלוק כבוד לארץ ישראל שהייתה חרבה אז."
            },
            {
                question: "מי היה חרבונה ומה היה חלקו?",
                options: ["בנו של המן", "שליח המלך", "סריס שהזכיר את העץ של המן", "משרת אסתר"],
                answer: 2,
                rationale: "הוא הפנה את תשומת לב המלך לעץ שבנה המן עבור מרדכי 'אשר דיבר טוב על המלך'."
            },
            {
                question: "כיצד קוראים את שמות עשרת בני המן?",
                options: ["במנגינה עליזה", "בקול רם", "בלחישה", "בנשימה אחת"],
                answer: 3,
                rationale: "להראות שכולם מתו יחד ונספו ברגע אחד."
            },
            {
                question: "מדוע נהוג להתחפש בפורים?",
                options: ["קרנבל חיצוני", "שהעניים לא יתביישו", "לזכר הנס בהסתרה ('הסתר פנים')", "להידמות למרדכי"],
                answer: 2,
                rationale: "לבטא את השגחת השם הנסתרת בתוך מסווה הטבע."
            },
            {
                question: "כמה פעמים מופיע שם השם המפורש במגילה?",
                options: ["אף פעם לא בגלוי", "פעם אחת", "7 פעמים", "בכל פרק"],
                answer: 0,
                rationale: "המגילה היא הספר היחיד בתנ\"ך ללא שם השם המפורש."
            },
            {
                question: "מהו 'פורים משולש'?",
                options: ["אדר א', ב' ושושן", "כשפורים חל בשבת ומחלקים המצוות", "חגיגה של 3 ימים", "פורים ביום שלישי"],
                answer: 1,
                rationale: "בירושלים מחלקים המצוות לשישי, שבת וראשון כדי למנוע חילול שבת."
            },
            {
                question: "האם נשים חייבות בקריאת המגילה?",
                options: ["פטורות", "חייבות, כי אף הן היו באותו הנס", "רק רווקות", "רק שמיעה"],
                answer: 1,
                rationale: "החיוב חל על נשים כי הנס נעשה על ידי אסתר ועבורן באותה מידה."
            },
            {
                question: "איזו תפילה מוסיפים בעמידה בפורים?",
                options: ["יעלה ויבוא", "הלל", "מעין המאורע", "על הניסים"],
                answer: 3,
                rationale: "תוספת ההודיה המיוחדת לימי הנס של פורים וחנוכה."
            },
            {
                question: "מה הכמות המינימלית למשלוח מנות?",
                options: ["מנה אחת", "שתי מנות מאכל שונות לאדם אחד", "לחם ומים", "פירות ושוקולד"],
                answer: 1,
                rationale: "שתי מנות שונות המוכנות לאכילה מיד לאדם אחד לפחות."
            },
            {
                question: "למה נמשלה אסתר במזמור כ\"ב בתהילים?",
                options: ["שושנה", "גפן", "איילת השחר", "יונה"],
                answer: 2,
                rationale: "המדרש מזהה את איילת השחר כאסתר המאירה את הגלות."
            },
            {
                question: "מהי משמעות 'קיבלו וקיימו' בסוף המגילה?",
                options: ["עלייה לירושלים", "צבא חזק", "ביטול צומות", "קבלת התורה מחדש מרצון"],
                answer: 3,
                rationale: "חז\"ל מלמדים שבפורים יהודים קיבלו את התורה מאהבה, בניגוד לכפייה בסיני."
            },
            {
                question: "מי הייתה זרש ומה הציעה?",
                options: ["אשת המן - הציעה לבנות עץ", "אחות המלך", "יועצת אסתר", "מלכת פרס"],
                answer: 0,
                rationale: "זרש הייתה אשתו של המן והיא זו שייעצה לו לבנות עץ בגובה 50 אמה."
            }
        ];

        function App() {
            const [step, setStep] = useState('start');
            const [index, setIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [selected, setSelected] = useState(null);
            const [encouragement, setEncouragement] = useState("");

            const praises = ["אשריך!", "חזק וברוך!", "מעולה!", "יישר כוח!", "כל הכבוד!", "בקיאות מופלאה!"];

            const startQuiz = () => {
                setScore(0);
                setIndex(0);
                setStep('quiz');
                setAnswered(false);
                setSelected(null);
            };

            const onSelect = (idx) => {
                if (answered) return;
                setSelected(idx);
                setAnswered(true);
                if (idx === questions[index].answer) {
                    setScore(s => s + 1);
                    playSound('correct');
                    setEncouragement(praises[Math.floor(Math.random() * praises.length)]);
                } else {
                    playSound('wrong');
                    setEncouragement("");
                }
            };

            const next = () => {
                if (index + 1 < questions.length) {
                    setIndex(index + 1);
                    setAnswered(false);
                    setSelected(null);
                    setEncouragement("");
                } else {
                    setStep('result');
                }
            };

            const shareQuiz = () => {
                const text = `הוצאתי ${score}/${questions.length} בחידון פורים של בניין איתן! מי מצליח לעקוף אותי?`;
                const url = window.location.href;
                if (navigator.share) {
                    navigator.share({ title: 'חידון פורים', text, url });
                } else {
                    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text + " " + url)}`;
                    window.open(whatsappUrl, '_blank');
                }
            };

            return (
                <div className="min-h-screen bg-indigo-50 flex flex-col items-center p-4">
                    {/* Shelter/Morale Banner */}
                    <div className="w-full max-w-2xl bg-yellow-400 text-yellow-900 py-3 px-6 rounded-b-2xl shadow-md text-center font-bold mb-6 banner-slide z-20">
                        🇮🇱 פורים חזק ובטוח לכל עם ישראל במקלטים ובחזית! השמחה היא הכוח שלנו. 🇮🇱
                    </div>

                    {step === 'start' && (
                        <div className="max-w-lg w-full bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-purple-200 z-10 animate-pop mt-10">
                            <div className="purim-gradient p-10 text-center text-white relative">
                                <BrandLogo light />
                                <h1 className="text-3xl font-black mb-2 mt-4">חידון פורים</h1>
                                <p className="text-lg opacity-90">יחד ננצח בשמחה!</p>
                            </div>
                            <div className="p-8 text-center">
                                <p className="text-gray-700 mb-8 text-xl font-medium leading-relaxed">
                                    בואו נפיג את המתח עם קצת תורה ושמחה! 
                                    <br />
                                    חידון מאתגר וכיפי לכל המשפחה.
                                </p>
                                <button onClick={startQuiz} className="bg-purple-600 hover:bg-purple-700 text-white font-black py-5 px-16 rounded-full text-2xl transition-all shadow-xl hover:scale-105 active:scale-95">
                                    קדימה, מתחילים!
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 'quiz' && (
                        <div className="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border-2 border-purple-100 z-10 animate-pop">
                            <div className="bg-purple-50 p-6 border-b flex flex-col gap-4">
                                <div className="flex justify-between items-center">
                                    <span className="font-black text-purple-800 text-lg">שאלה {index + 1} / {questions.length}</span>
                                    <div className="flex gap-1">
                                        {[...Array(score)].map((_, i) => (
                                            <span key={i} className="basket-item text-2xl">🍬</span>
                                        ))}
                                        {score > 0 && <span className="text-2xl">🧺</span>}
                                    </div>
                                </div>
                                <div className="w-full h-4 bg-purple-100 rounded-full overflow-hidden border border-purple-200">
                                    <div className="h-full bg-purple-600 transition-all duration-500 shadow-inner" style={{width: `${((index+1)/questions.length)*100}%`}}></div>
                                </div>
                            </div>

                            <div className="p-8 md:p-12 relative">
                                {encouragement && (
                                    <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-green-500 text-white px-6 py-2 rounded-full font-black text-xl shadow-lg animate-bounce z-30">
                                        {encouragement}
                                    </div>
                                )}
                                
                                <h2 className="text-2xl md:text-3xl font-black mb-10 text-gray-800 leading-tight text-center">{questions[index].question}</h2>
                                
                                <div className="grid grid-cols-1 gap-4">
                                    {questions[index].options.map((opt, i) => {
                                        let style = "border-gray-200 hover:border-purple-400 hover:bg-purple-50";
                                        if (answered) {
                                            if (i === questions[index].answer) style = "bg-green-100 border-green-500 text-green-900 correct-pulse scale-105";
                                            else if (selected === i) style = "bg-red-50 border-red-500 text-red-900 shake opacity-70";
                                            else style = "opacity-40 border-gray-100 grayscale";
                                        }
                                        return (
                                            <button 
                                                key={i} 
                                                onClick={() => onSelect(i)} 
                                                disabled={answered} 
                                                className={`w-full p-5 text-right border-4 rounded-2xl transition-all font-bold text-xl shadow-sm ${style} flex justify-between items-center`}
                                            >
                                                <span>{opt}</span>
                                                {answered && i === questions[index].answer && <span className="text-2xl">✨</span>}
                                            </button>
                                        );
                                    })}
                                </div>

                                {answered && (
                                    <div className="mt-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                        <div className="bg-blue-50 p-6 rounded-2xl border-2 border-blue-200 mb-8 shadow-inner">
                                            <p className="text-blue-900 text-lg leading-relaxed">
                                                <strong className="block text-xl mb-1">💡 פנינה מהמקורות:</strong>
                                                {questions[index].rationale}
                                            </p>
                                        </div>
                                        <button onClick={next} className="w-full bg-purple-800 text-white py-5 rounded-2xl font-black text-2xl hover:bg-black transition-all shadow-xl active:scale-95 flex items-center justify-center gap-3">
                                            {index + 1 === questions.length ? "לסיום החגיגי!" : "לשאלה הבאה"}
                                            <span className="rotate-180 text-3xl">⬅️</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 'result' && (
                        <div className="max-w-lg w-full bg-white rounded-3xl shadow-2xl overflow-hidden text-center p-12 border-8 border-yellow-400 z-10 animate-pop mt-10 relative">
                            <BrandLogo />
                            <h2 className="text-4xl font-black mb-4 text-purple-900">כל הכבוד!</h2>
                            <p className="text-2xl text-gray-600 font-bold mb-8">הצלחתם לאסוף {score} מנות בסל!</p>
                            
                            <div className="bg-indigo-50 rounded-3xl p-10 mb-10 shadow-inner">
                                <div className="text-8xl font-black text-indigo-600 mb-2">{Math.round((score/questions.length)*100)}%</div>
                                <div className="flex justify-center gap-2 mt-4 flex-wrap">
                                    {[...Array(score)].map((_, i) => <span key={i} className="text-3xl floating" style={{animationDelay: `${i*0.2}s`}}>🍪</span>)}
                                </div>
                            </div>

                            <p className="text-2xl text-gray-800 mb-10 font-bold leading-relaxed px-4">
                                {score === questions.length ? "בקיאות מדהימה! אתם ראויים לכתר מלכות. שנזכה לאורה ושמחה!" :
                                 score >= 15 ? "יישר כוח! ידע תורני מרשים ביותר. פורים שמח!" :
                                 "סיום יפה מאוד! תמיד טוב לחזור למגילה וללמוד."}
                            </p>

                            <div className="flex flex-col gap-4">
                                <button onClick={shareQuiz} className="bg-green-600 text-white py-4 rounded-full font-black text-xl hover:bg-green-700 transition-all shadow-xl active:scale-95 flex items-center justify-center gap-2">
                                    שתפו לחברים בוואטסאפ 📱
                                </button>
                                <button onClick={startQuiz} className="text-purple-600 font-bold py-2 hover:underline">
                                    סיבוב נוסף? 🔄
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
