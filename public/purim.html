                                    </p>
                                    <div className="flex justify-center gap-1 mt-3 flex-wrap">
                                        {[...Array(Math.min(score, 12))].map((_, i) => <span key={i} className="text-xl floating" style={{animationDelay: `${i*0.1}s`}}>🍪</span>)}
                                    </div>
                                </div>

                                <p className="text-base sm:text-lg text-gray-800 mb-6 font-bold leading-tight px-2">
                                    {score === currentQuestions.length ? "בקיאות מדהימה! תשובות מושלמות." : 
                                     score >= 18 ? "יישר כוח! ידע תורני מרשים ביותר." : 
                                     "סיום יפה! תמיד טוב לחזור למקורות וללמוד."}
                                </p>

                                <div className="flex flex-col gap-3">
                                    {level === 1 ? (
                                        <button 
                                            onClick={() => { setLevel(2); setStep('start'); }} 
                                            className="w-full bg-purple-600 text-white py-4 rounded-full font-black text-lg shadow-lg active:scale-95 transition-all animate-bounce"
                                        >
                                            מעבר לחידון ההמשך (שלב ב') 🚀
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={shareQuiz} 
                                            className="w-full bg-green-600 text-white py-4 rounded-full font-black text-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2"
                                        >
                                            שתפו לחברים בוואטסאפ 📱
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => { setLevel(1); startQuiz(); }} 
                                        className="text-purple-600 font-bold py-2 text-sm hover:underline"
                                    >
                                        סיבוב נוסף מההתחלה? 🔄
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
